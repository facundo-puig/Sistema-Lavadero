[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint]
# RUF012 marca las listas a nivel de clase, que Django y DRF usan por todos lados
# (permission_classes, fields, migraciones...).
ignore = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
# Los tests de cada app pueden estar en tests.py o en archivos test_*.py.
python_files = ["tests.py", "test_*.py"]
addopts = "-ra"